<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <rect width="1200" height="820" fill="#f6f1e8"/>
  <text x="40" y="40" font-size="22" font-weight="600" fill="#1c1917">Mark Map architecture</text>
  <text x="40" y="62" font-size="13" fill="#57534e">Request path · multi-agent desk · Strands agent loop</text>

  <!-- ========== 1 REQUEST ARCHITECTURE ========== -->
  <rect x="32" y="84" width="1136" height="200" rx="18" fill="#fffdf8" stroke="#e7e0d4"/>
  <text x="52" y="112" font-size="11" font-weight="600" letter-spacing="0.14em" fill="#a8a29e">1  REQUEST ARCHITECTURE</text>

  <rect x="52" y="128" width="130" height="56" rx="12" fill="#fff" stroke="#d6d3d1"/>
  <text x="117" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">Teacher</text>
  <text x="117" y="168" text-anchor="middle" font-size="10" fill="#78716c">student · parent</text>

  <path d="M190 156 H230" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="236" y="128" width="150" height="56" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="311" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">HTTPS edge</text>
  <text x="311" y="168" text-anchor="middle" font-size="10" fill="#78716c">App Runner</text>

  <path d="M394 156 H434" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="440" y="128" width="150" height="56" rx="12" fill="#fff" stroke="#d6d3d1"/>
  <text x="515" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">FastAPI</text>
  <text x="515" y="168" text-anchor="middle" font-size="10" fill="#78716c">cookie · role</text>

  <!-- fork -->
  <path d="M598 156 H640" stroke="#1c1917" stroke-width="1.6"/>
  <path d="M640 156 V132 H668" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M640 156 V180 H668" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="674" y="108" width="210" height="48" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="779" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">Human write</text>
  <text x="779" y="144" text-anchor="middle" font-size="10" fill="#78716c">PATCH cell · chapter · OCR</text>

  <rect x="674" y="164" width="210" height="48" rx="12" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="779" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">Agent write</text>
  <text x="779" y="200" text-anchor="middle" font-size="10" fill="#78716c">POST /desk/run · /sweep</text>

  <path d="M892 132 H920 V156 H948" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M892 188 H920 V156" stroke="#1c1917" stroke-width="1.6"/>

  <rect x="954" y="128" width="190" height="56" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1049" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">JSON store</text>
  <text x="1049" y="168" text-anchor="middle" font-size="10" fill="#78716c">marks · briefs · nags</text>

  <text x="52" y="250" font-size="11" fill="#78716c">EventBridge → POST /api/desk/sweep uses the agent path. Parent/student GET never includes teacher_brief.</text>

  <!-- ========== 2 MULTI-AGENT ========== -->
  <rect x="32" y="300" width="1136" height="268" rx="18" fill="#fffdf8" stroke="#e7e0d4"/>
  <text x="52" y="328" font-size="11" font-weight="600" letter-spacing="0.14em" fill="#a8a29e">2  MULTI-AGENT DESK</text>
  <text x="52" y="348" font-size="12" fill="#57534e">One Strands orchestrator. Five specialist roles. Python executes; the orchestrator only calls tools.</text>

  <!-- orchestrator -->
  <rect x="420" y="368" width="360" height="72" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="600" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#1c1917">Desk Runner  ·  Strands Agent</text>
  <text x="600" y="416" text-anchor="middle" font-size="11" fill="#57534e">Bedrock Converse  ·  observe → plan → act</text>

  <!-- arrows down to specialists -->
  <path d="M600 440 V462" stroke="#1c1917" stroke-width="1.4"/>
  <path d="M140 462 H1060" stroke="#1c1917" stroke-width="1.4"/>
  <path d="M140 462 V478" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M370 462 V478" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M600 462 V478" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M830 462 V478" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M1060 462 V478" stroke="#1c1917" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="52" y="482" width="176" height="64" rx="12" fill="#fff" stroke="#5eead4"/>
  <text x="140" y="508" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">Ingest Clerk</text>
  <text x="140" y="526" text-anchor="middle" font-size="10" fill="#78716c">paper · OCR · load class</text>

  <rect x="282" y="482" width="176" height="64" rx="12" fill="#fff" stroke="#c4b5fd"/>
  <text x="370" y="508" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">Paper Mapper</text>
  <text x="370" y="526" text-anchor="middle" font-size="10" fill="#78716c">question → chapter</text>

  <rect x="512" y="482" width="176" height="64" rx="12" fill="#fff" stroke="#fda4af"/>
  <text x="600" y="508" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">Score Clerk</text>
  <text x="600" y="526" text-anchor="middle" font-size="10" fill="#78716c">cells · empty ≠ 0</text>

  <rect x="742" y="482" width="176" height="64" rx="12" fill="#fff" stroke="#86efac"/>
  <text x="830" y="508" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">Analyser</text>
  <text x="830" y="526" text-anchor="middle" font-size="10" fill="#78716c">hotspots · completeness</text>

  <rect x="972" y="482" width="176" height="64" rx="12" fill="#fff" stroke="#7dd3fc"/>
  <text x="1060" y="508" text-anchor="middle" font-size="12" font-weight="600" fill="#1c1917">Brief Writer</text>
  <text x="1060" y="526" text-anchor="middle" font-size="10" fill="#78716c">teacher ≠ family</text>

  <!-- policy bar -->
  <rect x="52" y="556" width="1096" height="0" fill="none"/>
  <rect x="200" y="556" width="800" height="36" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="600" y="578" text-anchor="middle" font-size="12" fill="#1c1917">Policy gate  ·  cancel write_mark · unlock_brief · set_question_chapter</text>

  <!-- ========== 3 AGENT LOOP ========== -->
  <rect x="32" y="584" width="1136" height="212" rx="18" fill="#fffdf8" stroke="#e7e0d4"/>
  <text x="52" y="612" font-size="11" font-weight="600" letter-spacing="0.14em" fill="#a8a29e">3  AGENT LOOP  (STRANDS)</text>

  <rect x="80" y="640" width="160" height="70" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="160" y="670" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">Model</text>
  <text x="160" y="688" text-anchor="middle" font-size="10" fill="#57534e">Bedrock Converse</text>

  <path d="M248 675 H300" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="274" y="666" text-anchor="middle" font-size="10" fill="#78716c">tool_use</text>

  <rect x="308" y="640" width="160" height="70" rx="14" fill="#fff" stroke="#d6d3d1"/>
  <text x="388" y="670" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">Tools</text>
  <text x="388" y="688" text-anchor="middle" font-size="10" fill="#57534e">4 desk tools</text>

  <path d="M476 675 H528" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="502" y="666" text-anchor="middle" font-size="10" fill="#78716c">BeforeToolCall</text>

  <rect x="536" y="640" width="160" height="70" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="616" y="670" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">Hook</text>
  <text x="616" y="688" text-anchor="middle" font-size="10" fill="#57534e">allow or cancel</text>

  <path d="M704 675 H756" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="730" y="666" text-anchor="middle" font-size="10" fill="#78716c">execute</text>

  <rect x="764" y="640" width="160" height="70" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="844" y="670" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">Python SoR</text>
  <text x="844" y="688" text-anchor="middle" font-size="10" fill="#57534e">facts · refuse empty</text>

  <path d="M932 675 H984" stroke="#1c1917" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="958" y="666" text-anchor="middle" font-size="10" fill="#78716c">tool_result</text>

  <rect x="992" y="640" width="160" height="70" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="1072" y="670" text-anchor="middle" font-size="13" font-weight="600" fill="#1c1917">Model</text>
  <text x="1072" y="688" text-anchor="middle" font-size="10" fill="#57534e">next step or stop</text>

  <!-- return loop -->
  <path d="M1072 710 V746 H160 V710" stroke="#0891b2" stroke-width="1.5" fill="none" marker-end="url(#arr-c)"/>
  <text x="616" y="766" text-anchor="middle" font-size="11" fill="#0e7490">repeat until stop  ·  list_incomplete_rows → hotspots → write_student_briefs → run_desk_nags</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1917"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/>
    </marker>
  </defs>
</svg>
